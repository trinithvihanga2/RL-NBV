# ============================================================
# COMPLETE TRAINING CONFIG
# ============================================================

# Dataset
dataset:
  dataset_path: ./dataset
  train_data_path: ./data/train
  verify_data_path: ./data/verify/
  test_data_path: ./data/test/

# Environment
environment:
  observation_space_dim: 1024
  terminated_coverage: 0.97
  max_step: 30
  is_ratio_reward: 1
  is_reward_with_cur_coverage: 0
  cur_coverage_ratio: 1.0
  time_cost_weight: 1.0
  delta_v_weight: 1.0
  fuel_budget: 50.0
  target_orbit:
    orbit_radius: 1.12
    grav_param: 1.0
    num_orbits: 2.0
    min_transfer_time: 0.1
    unit_scale: 6.25
  state_reward:
    revisit_penalty: -5.0
    coverage_coeff: 1.0
    good_coverage_threshold: 0.01
    near_distance_threshold: 0.2
  is_vec_env: 1
  env_num: 8
  sun_position:
    initial_direction: [1.0, 0.0, 0.0]
    orbital_params:
      angular_velocity_rad_per_s: 0.1
      initial_phase_rad: 0.0
      time_offset_s: 0.0

# Training
training:
  step_size: 10
  is_ratio_reward: 1
  is_profile: 0
  resume: 1

  # PPO Hyperparameters
  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 32
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    total_steps: 1000000

  # Pretrained PointNet
  pretrained:
    is_transform: 1
    model_path: ./models/pretrained/pointnet2_ssg_wo_normals/checkpoints/best_model.pth
    is_freeze_fe: 0

  # Saving & Output
  output:
    output_file: ./artefacts/train/train_result.txt
    checkpoint_path: ./artefacts/train/checkpoints
    final_model_path: ./artefacts/train/final
    save_freq: 10000
    eval_freq: 10000
    is_save_model: 1

  # Logging
  logging:
    log_file: ./artefacts/train/train.log
    coverage_log_freq_normal: 50000
    coverage_log_freq_profile: 200
    progress_log_interval: 10

# Dataset Splitting
dataset_splitting:
  train_ratio: 0.7
  verify_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  log_path: ./artefacts/ds/split_dataset.log
