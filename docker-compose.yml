services:
  trainer:
    build: .
    container_name: rl-nbv-trainer
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_ID:-0}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./artefacts:/app/artefacts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: "8g"
